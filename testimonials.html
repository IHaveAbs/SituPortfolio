<!-- Parent testimonials fragment. Loaded into #content-frame by script.js.
     Reads the current subcategory from window.getCurrentContext() and renders
     window.TESTIMONIALS[key]. Styles live in styles.css. -->
<div class="testimonials-container">
    <h1 class="gallery-title" id="testimonialsTitle">What Parents Said</h1>
    <p class="gallery-intro" id="testimonialsIntro" style="display:none;"></p>
    <div class="testimonials-grid" id="testimonials"></div>
</div>

<div id="imageModal" class="modal">
    <span class="close">&times;</span>
    <button class="gallery-nav-arrow prev" type="button">&#10094;</button>
    <div class="modal-content">
        <img class="modal-image" id="modalImage" alt="">
        <div class="modal-caption" id="modalCaption"></div>
    </div>
    <button class="gallery-nav-arrow next" type="button">&#10095;</button>
</div>

<script>
(function () {
    var ctx = (typeof window.getCurrentContext === "function") ? window.getCurrentContext() : {};
    var key = ctx.subcategory || ctx.category;
    var data = (window.TESTIMONIALS && window.TESTIMONIALS[key]) || null;

    var titleEl = document.getElementById("testimonialsTitle");
    var introEl = document.getElementById("testimonialsIntro");
    var grid = document.getElementById("testimonials");

    if (!data) {
        titleEl.textContent = "Coming soon";
        grid.innerHTML = '<div class="coming-soon">No feedback here yet.</div>';
        return;
    }

    titleEl.textContent = data.title || "What Parents Said";
    if (data.intro) { introEl.textContent = data.intro; introEl.style.display = "block"; }

    function esc(s) {
        return String(s == null ? "" : s)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    var items = data.items || [];

    items.forEach(function (item, index) {
        var card = document.createElement("div");
        card.className = "testimonial-card";

        var shot = item.src
            ? '<img class="testimonial-thumb" loading="lazy" src="' + esc(item.src) + '" ' +
              'alt="Original message" data-index="' + index + '" ' +
              'role="button" tabindex="0" aria-label="View the original message">'
            : "";

        card.innerHTML =
            '<blockquote class="testimonial-quote">' + esc(item.en) + "</blockquote>" +
            '<p class="testimonial-zh" lang="zh">' + esc(item.zh) + "</p>" +
            '<div class="testimonial-meta">' + esc(item.meta) + "</div>" +
            shot;
        grid.appendChild(card);
    });

    var modal = document.getElementById("imageModal");
    var modalImage = document.getElementById("modalImage");
    var modalCaption = document.getElementById("modalCaption");
    var currentIndex = 0;

    function show(index) {
        var item = items[index];
        modalImage.src = item.src;
        modalImage.alt = "Original message";
        modalCaption.innerHTML = "<strong>" + esc(item.meta) + "</strong><br>" + esc(item.en);
    }
    function openModal(index) {
        currentIndex = index;
        show(index);
        modal.style.display = "block";
        document.body.style.overflow = "hidden";
    }
    function closeModal() {
        modal.style.display = "none";
        document.body.style.overflow = "auto";
    }
    function changeImage(direction) {
        if (!items.length) return;
        currentIndex = (currentIndex + direction + items.length) % items.length;
        show(currentIndex);
    }

    grid.addEventListener("click", function (e) {
        var thumb = e.target.closest(".testimonial-thumb");
        if (thumb) openModal(Number(thumb.getAttribute("data-index")));
    });
    grid.addEventListener("keydown", function (e) {
        if (e.key !== "Enter" && e.key !== " ") return;
        var thumb = e.target.closest(".testimonial-thumb");
        if (thumb) { e.preventDefault(); openModal(Number(thumb.getAttribute("data-index"))); }
    });

    modal.querySelector(".close").addEventListener("click", closeModal);
    modal.querySelector(".prev").addEventListener("click", function () { changeImage(-1); });
    modal.querySelector(".next").addEventListener("click", function () { changeImage(1); });
    modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });

    // Replace any keydown handler from a previously loaded gallery so they don't stack.
    if (window.__galleryKeydown) document.removeEventListener("keydown", window.__galleryKeydown);
    window.__galleryKeydown = function (e) {
        if (modal.style.display !== "block") return;
        if (e.key === "Escape") closeModal();
        else if (e.key === "ArrowLeft") changeImage(-1);
        else if (e.key === "ArrowRight") changeImage(1);
    };
    document.addEventListener("keydown", window.__galleryKeydown);
})();
</script>
