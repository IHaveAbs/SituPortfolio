<!-- Reusable gallery fragment. Loaded into #content-frame by script.js.
     Reads the current subcategory/category from window.getCurrentContext()
     and renders window.GALLERIES[key]. Styles live in styles.css. -->
<div class="gallery-container">
    <h1 class="gallery-title" id="galleryTitle">Gallery</h1>
    <p class="gallery-intro" id="galleryIntro" style="display:none;"></p>
    <div class="gallery-grid" id="gallery"></div>
</div>

<div id="imageModal" class="modal">
    <span class="close">&times;</span>
    <button class="gallery-nav-arrow prev" type="button">&#10094;</button>
    <div class="modal-content">
        <img class="modal-image" id="modalImage" alt="">
        <div class="modal-caption" id="modalCaption"></div>
    </div>
    <button class="gallery-nav-arrow next" type="button">&#10095;</button>
</div>

<script>
(function () {
    var ctx = (typeof window.getCurrentContext === "function") ? window.getCurrentContext() : {};
    // Prefer subcategory (Art/Activities), fall back to category (single-gallery sections).
    var key = ctx.subcategory || ctx.category;
    var data = (window.GALLERIES && window.GALLERIES[key]) || null;

    var titleEl = document.getElementById("galleryTitle");
    var introEl = document.getElementById("galleryIntro");
    var grid = document.getElementById("gallery");
    var modal = document.getElementById("imageModal");
    var modalImage = document.getElementById("modalImage");
    var modalCaption = document.getElementById("modalCaption");

    if (!data) {
        titleEl.textContent = "Coming soon";
        grid.innerHTML = '<div class="coming-soon">This section doesn\'t have any content yet.</div>';
        return;
    }

    titleEl.textContent = data.title || "Gallery";

    // Placeholder-only section (e.g. Programming)
    if (data.placeholder) {
        grid.innerHTML = '<div class="coming-soon">' + (data.message || "Coming soon.") + "</div>";
        return;
    }

    if (data.intro) {
        introEl.textContent = data.intro;
        introEl.style.display = "block";
    }

    var images = data.items || [];

    // Optional "videos coming soon" card at the front of the grid.
    if (data.videoPlaceholder) {
        var vp = document.createElement("div");
        vp.className = "gallery-item video-placeholder";
        vp.innerHTML =
            '<div class="video-placeholder-inner">' +
            '<div class="video-placeholder-icon">🎬</div>' +
            '<div class="video-placeholder-text">Videos coming soon</div>' +
            "</div>";
        grid.appendChild(vp);
    }

    function esc(s) {
        return String(s == null ? "" : s)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    images.forEach(function (image, index) {
        var item = document.createElement("div");
        item.className = "gallery-item";
        item.addEventListener("click", function () { openModal(index); });
        item.innerHTML =
            '<img loading="lazy" src="' + esc(image.src) + '" alt="' + esc(image.title) + '">' +
            '<div class="image-overlay">' +
            '<div class="image-title">' + esc(image.title) + "</div>" +
            '<div class="image-description">' + esc(image.description) + "</div>" +
            "</div>";
        grid.appendChild(item);
    });

    var currentIndex = 0;

    function show(index) {
        var image = images[index];
        modalImage.src = image.src;
        modalImage.alt = image.title || "";
        modalCaption.innerHTML = "<strong>" + esc(image.title) + "</strong><br>" + esc(image.description);
    }
    function openModal(index) {
        currentIndex = index;
        show(index);
        modal.style.display = "block";
        document.body.style.overflow = "hidden";
    }
    function closeModal() {
        modal.style.display = "none";
        document.body.style.overflow = "auto";
    }
    function changeImage(direction) {
        if (!images.length) return;
        currentIndex = (currentIndex + direction + images.length) % images.length;
        show(currentIndex);
    }

    modal.querySelector(".close").addEventListener("click", closeModal);
    modal.querySelector(".prev").addEventListener("click", function () { changeImage(-1); });
    modal.querySelector(".next").addEventListener("click", function () { changeImage(1); });
    modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });

    // Replace any keydown handler from a previously loaded gallery so they don't stack.
    if (window.__galleryKeydown) document.removeEventListener("keydown", window.__galleryKeydown);
    window.__galleryKeydown = function (e) {
        if (modal.style.display !== "block") return;
        if (e.key === "Escape") closeModal();
        else if (e.key === "ArrowLeft") changeImage(-1);
        else if (e.key === "ArrowRight") changeImage(1);
    };
    document.addEventListener("keydown", window.__galleryKeydown);
})();
</script>
